name: Normalize blocklist

# Runs whenever blocklist.json changes: lowercases + dedupes + sorts every list,
# and bumps `version` + `updated` when the actual entries changed. The bot's own
# commit carries [skip ci], so it never loops.
on:
  push:
    branches: [main]
    paths: ["blocklist.json"]

permissions:
  contents: write

concurrency:
  group: normalize-blocklist

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize + version
        run: |
          python3 - <<'PY'
          import json, datetime
          p = "blocklist.json"
          data = json.load(open(p))
          keys = ("fingerprints", "authors", "descriptions")
          def norm(xs): return sorted({str(x).strip().lower() for x in xs if str(x).strip()})
          new = {k: norm(data.get(k, [])) for k in keys}
          # Did the human change the actual entries (add / case / dupes / order)?
          changed = any(new[k] != list(data.get(k, [])) for k in keys)
          out = {
              "version": (int(data.get("version", 0)) + 1) if changed else int(data.get("version", 0)),
              "updated": (datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z")
                         if changed else data.get("updated", ""),
          }
          out.update(new)
          with open(p, "w") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print("changed" if changed else "already normalized")
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain blocklist.json)" ]; then
            git config user.name "blocklist-bot"
            git config user.email "actions@users.noreply.github.com"
            git add blocklist.json
            git commit -m "chore: normalize blocklist [skip ci]"
            git push
          else
            echo "no changes to commit"
          fi
