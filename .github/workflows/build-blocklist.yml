name: Build blocklist

# You edit the plain line-lists in sources/*.txt (one entry per line, no JSON,
# nothing to break). On every change this rebuilds blocklist.json (valid,
# lowercased, deduped, sorted) and bumps version/updated. The launcher fetches
# the generated blocklist.json.
on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - ".github/workflows/build-blocklist.yml"

permissions:
  contents: write

concurrency:
  group: build-blocklist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blocklist.json from sources
        run: |
          python3 - <<'PY'
          import json, datetime, os
          def read_list(path):
              if not os.path.exists(path):
                  return []
              out = []
              for line in open(path, encoding="utf-8"):
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  out.append(s.lower())
              return sorted(set(out))
          new = {
              "fingerprints": read_list("sources/fingerprints.txt"),
              "authors":      read_list("sources/authors.txt"),
              "descriptions": read_list("sources/descriptions.txt"),
          }
          old = {}
          if os.path.exists("blocklist.json"):
              try:
                  old = json.load(open("blocklist.json"))
              except Exception:
                  old = {}
          changed = any(new[k] != old.get(k, []) for k in new)
          out = {
              "version": (int(old.get("version", 0)) + 1) if changed else int(old.get("version", 0)),
              "updated": (datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z")
                         if changed else old.get("updated", ""),
          }
          out.update(new)
          with open("blocklist.json", "w") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print(f"fingerprints={len(new['fingerprints'])} authors={len(new['authors'])} descriptions={len(new['descriptions'])} changed={changed}")
          PY

      - name: Commit generated blocklist.json
        run: |
          if [ -n "$(git status --porcelain blocklist.json)" ]; then
            git config user.name "FrogCsLoL"
            git config user.email "FrogCsLoL@users.noreply.github.com"
            git add blocklist.json
            git commit -m "chore: rebuild blocklist.json from sources"
            git push
          else
            echo "no change"
          fi
